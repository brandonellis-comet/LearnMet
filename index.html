<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LearnMet Study Tracker</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d2320; --muted: #5d665f; --line: #d9d8d0;
    --accent: #2f5d50;
    --none-bg: #ecebe4; --none-fg: #5d665f;
    --learn-bg: #f6dcc4; --learn-fg: #9a4d1a;
    --solid-bg: #d6e8d8; --solid-fg: #2c5f36;
    --review-bg: #e2dbf3; --review-fg: #50407f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151816; --card: #1f2321; --ink: #ecefea; --muted: #a2aaa4; --line: #343a36;
      --accent: #7fc3ad;
      --none-bg: #2b302d; --none-fg: #a2aaa4;
      --learn-bg: #4a3220; --learn-fg: #f1b98a;
      --solid-bg: #1f3d26; --solid-fg: #9fd7a8;
      --review-bg: #32294d; --review-fg: #c5b6ee;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.35rem; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 14px; }
  .bar { height: 10px; background: var(--none-bg); border-radius: 6px; overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }
  .b-solid { background: var(--solid-fg); } .b-review { background: var(--review-fg); } .b-learn { background: var(--learn-fg); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: .85rem; color: var(--muted); margin: 8px 0 14px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  button, select, input[type=text] { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  button { cursor: pointer; min-height: 40px; }
  button:hover { border-color: var(--accent); }
  input[type=text] { flex: 1; min-width: 140px; }
  details.cat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  details.cat > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
  details.cat > summary::-webkit-details-marker { display: none; }
  .cnt { font-weight: 400; color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .topic { border-top: 1px solid var(--line); padding: 10px 14px; }
  .trow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tname { flex: 1 1 240px; }
  .lvl { font-size: .85rem; border-radius: 8px; padding: 6px 10px; border: 1px solid transparent; font-weight: 600; }
  .lvl.none { background: var(--none-bg); color: var(--none-fg); }
  .lvl.learning { background: var(--learn-bg); color: var(--learn-fg); }
  .lvl.solid { background: var(--solid-bg); color: var(--solid-fg); }
  .lvl.review { background: var(--review-bg); color: var(--review-fg); }
  .note { width: 100%; margin-top: 8px; font: inherit; font-size: .9rem; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; min-height: 40px; }
  .hint { font-size: .8rem; color: var(--muted); margin-top: 16px; }
  #msg { font-size: .85rem; color: var(--accent); min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LearnMet Study Tracker</h1>
  <div class="sub">Met Tech self-study. Tap a level to cycle it. Notes = notebook page refs or gaps.</div>

  <div class="bar" id="bar"></div>
  <div class="stats" id="stats"></div>

  <div class="tools">
    <input type="text" id="q" placeholder="Filter topics">
    <select id="filter">
      <option value="all">All levels</option>
      <option value="none">Not started</option>
      <option value="learning">Learning</option>
      <option value="review">Needs review</option>
      <option value="solid">Solid</option>
    </select>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <div id="msg"></div>

  <div id="list"></div>

  <div class="hint">
    Progress saves in this browser. To keep it permanent, tap Export and send the file to Claude, who commits it as progress.json. Import loads a saved file.
  </div>
</div>

<script>
const LEVELS = [
  { id: "none", label: "Not started" },
  { id: "learning", label: "Learning" },
  { id: "solid", label: "Solid" },
  { id: "review", label: "Needs review" }
];
const KEY = "learnmet-progress-v1";

const CATEGORIES = [
  { id: "foundations", title: "1. Atmospheric Foundations", topics: [
    "Composition and vertical structure (troposphere to thermosphere)",
    "Temperature, pressure, humidity relationships",
    "Hydrostatic balance and the standard atmosphere",
    "Stability and lapse rates (dry, moist, environmental)",
    "Adiabatic processes and potential temperature"
  ]},
  { id: "wind", title: "2. Wind and Circulation", topics: [
    "Pressure gradient force and Coriolis effect",
    "Geostrophic, gradient and thermal wind",
    "Friction and boundary layer winds",
    "General circulation (Hadley, Ferrel, Polar cells)",
    "Jet streams",
    "Local winds (sea/land breeze, katabatic, valley)"
  ]},
  { id: "moisture", title: "3. Moisture, Clouds and Precipitation", topics: [
    "Humidity measures (dew point, RH, mixing ratio)",
    "Condensation, saturation and lifting mechanisms",
    "Cloud classification and genera",
    "Precipitation processes (warm rain, ice crystal)",
    "Fog types and formation",
    "Icing and its causes"
  ]},
  { id: "airmass", title: "4. Air Masses and Fronts", topics: [
    "Air mass classification and source regions",
    "Cold, warm, stationary and occluded fronts",
    "Frontal cross-sections and associated weather",
    "Frontogenesis and frontolysis"
  ]},
  { id: "synoptic", title: "5. Synoptic and Mesoscale Systems", topics: [
    "Extratropical cyclone life cycle",
    "Upper-air patterns (troughs, ridges, cut-off lows)",
    "Vorticity and divergence",
    "Mesoscale systems (MCS, squall lines)",
    "Tropical cyclones and post-tropical transition"
  ]},
  { id: "severe", title: "6. Severe and Hazardous Weather", topics: [
    "Thunderstorm structure and life cycle",
    "Tornadoes and downbursts",
    "Winter storms and freezing precipitation",
    "Turbulence (CAT, mechanical, mountain wave)",
    "Wind shear and low-level jets",
    "Hazard warning criteria (ECCC)"
  ]},
  { id: "obs", title: "7. Observations and Instruments", topics: [
    "Surface observing (temperature, pressure, wind, visibility)",
    "Upper-air soundings and radiosondes",
    "Weather radar principles and interpretation",
    "Satellite imagery (visible, IR, water vapour)",
    "Reading and plotting a skew-T log-P"
  ]},
  { id: "codes", title: "8. Codes, Charts and Forecasting", topics: [
    "METAR / SPECI decoding",
    "TAF decoding and amendment criteria",
    "Surface analysis and prognostic charts",
    "Upper-air charts (850, 700, 500, 250 hPa)",
    "Numerical weather prediction (GEM, GFS, ECMWF) and limitations",
    "Forecast verification and persistence"
  ]},
  { id: "applied", title: "9. Applied and Tactical Meteorology", topics: [
    "Aviation weather requirements and minima",
    "Marine weather (sea state, swell, wind waves)",
    "Weather effects on military operations",
    "Briefing structure and delivery",
    "Climatology of the Atlantic region"
  ]}
];

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { flash("Browser storage unavailable. Use Export."); }
}
let state = load();
const get = (cid, i) => state[cid + ":" + i] || { level: "none", note: "" };
let msgTimer;
function flash(t) { const m = document.getElementById("msg"); m.textContent = t; clearTimeout(msgTimer); msgTimer = setTimeout(() => m.textContent = "", 4000); }
const lvlLabel = id => LEVELS.find(l => l.id === id).label;

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const f = document.getElementById("filter").value;
  const openIds = new Set([...document.querySelectorAll("details.cat[open]")].map(d => d.dataset.id));
  const list = document.getElementById("list");
  list.innerHTML = "";
  const totals = { none: 0, learning: 0, solid: 0, review: 0 };
  let all = 0;

  CATEGORIES.forEach(cat => {
    cat.topics.forEach((t, i) => { totals[get(cat.id, i).level]++; all++; });
    const rows = cat.topics.map((t, i) => ({ t, i, s: get(cat.id, i) }))
      .filter(r => (f === "all" || r.s.level === f) && (!q || r.t.toLowerCase().includes(q) || r.s.note.toLowerCase().includes(q)));
    if (!rows.length) return;
    const solid = cat.topics.filter((t, i) => get(cat.id, i).level === "solid").length;
    const d = document.createElement("details");
    d.className = "cat"; d.dataset.id = cat.id;
    if (openIds.has(cat.id) || q || f !== "all") d.open = true;
    d.innerHTML = `<summary><span>${cat.title}</span><span class="cnt">${solid}/${cat.topics.length} solid</span></summary>`;
    rows.forEach(r => {
      const div = document.createElement("div");
      div.className = "topic";
      const row = document.createElement("div");
      row.className = "trow";
      const name = document.createElement("div");
      name.className = "tname"; name.textContent = r.t;
      const btn = document.createElement("button");
      btn.className = "lvl " + r.s.level; btn.textContent = lvlLabel(r.s.level);
      btn.onclick = () => {
        const idx = (LEVELS.findIndex(l => l.id === r.s.level) + 1) % LEVELS.length;
        state[cat.id + ":" + r.i] = { level: LEVELS[idx].id, note: r.s.note };
        save(); render();
      };
      row.append(name, btn);
      const ta = document.createElement("textarea");
      ta.className = "note"; ta.placeholder = "Notes / notebook ref"; ta.value = r.s.note; ta.rows = 1;
      ta.onchange = () => { const cur = get(cat.id, r.i); state[cat.id + ":" + r.i] = { level: cur.level, note: ta.value }; save(); };
      div.append(row, ta);
      d.append(div);
    });
    list.append(d);
  });

  const pct = n => (all ? (n / all) * 100 : 0).toFixed(1);
  document.getElementById("bar").innerHTML =
    `<span class="b-solid" style="width:${pct(totals.solid)}%"></span>` +
    `<span class="b-review" style="width:${pct(totals.review)}%"></span>` +
    `<span class="b-learn" style="width:${pct(totals.learning)}%"></span>`;
  document.getElementById("stats").innerHTML =
    `<span>${all} topics</span><span>Solid: ${totals.solid}</span><span>Needs review: ${totals.review}</span><span>Learning: ${totals.learning}</span><span>Not started: ${totals.none}</span>`;
}

document.getElementById("q").oninput = render;
document.getElementById("filter").onchange = render;
document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify({ version: 1, exported: new Date().toISOString(), progress: state }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "progress.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  flash("Exported progress.json");
};
document.getElementById("import").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.progress || typeof data.progress !== "object") throw new Error("bad format");
      state = data.progress; save(); render(); flash("Imported");
    } catch (err) { flash("Import failed: not a valid progress file"); }
  };
  r.readAsText(file); e.target.value = "";
};

// First load with no local data: pull the committed progress.json if present.
(async function init() {
  if (!Object.keys(state).length) {
    try {
      const res = await fetch("progress.json", { cache: "no-store" });
      if (res.ok) { const d = await res.json(); if (d.progress) { state = d.progress; save(); } }
    } catch (e) {}
  }
  render();
})();
</script>
</body>
</html>
